title: LSASS Memory Dump via comsvcs.dll MiniDump Export
id: 4b1e9f2a-8c3d-47b2-9e1a-purple-lab-T1003001
status: stable
description: |
  Detects the well-known LOLBAS pattern where rundll32.exe is used to invoke
  the MiniDump export of comsvcs.dll — the canonical file-less way to dump
  process memory on Windows, most commonly against lsass.exe to harvest
  credentials. The rule fires on any target to catch the variant where an
  attacker picks a non-obvious PID or uses an intermediate process.
author: cyberknight91
date: 2026/04/20
references:
  - https://attack.mitre.org/techniques/T1003/001/
  - https://lolbas-project.github.io/lolbas/Libraries/Comsvcs/
tags:
  - attack.credential_access
  - attack.t1003.001
  - attack.defense_evasion
  - attack.t1218.011
logsource:
  category: process_creation
  product: windows
detection:
  selection_rundll32:
    Image|endswith:
      - '\rundll32.exe'
      - '\rundll32'
  selection_comsvcs:
    CommandLine|contains|all:
      - 'comsvcs'
      - 'MiniDump'
  # Shorter variants where the attacker uses #24 (the ordinal of MiniDump
  # in comsvcs.dll) instead of the function name.
  selection_ordinal:
    CommandLine|contains|all:
      - 'comsvcs'
      - '#24'
  condition: selection_rundll32 and (selection_comsvcs or selection_ordinal)
fields:
  - User
  - Image
  - ParentImage
  - CommandLine
  - ProcessGuid
falsepositives:
  - Internal tabletop exercises / red team engagements — whitelist the
    source host or the specific ProcessGuid for the duration of the exercise.
  - Very rare legitimate tooling that uses comsvcs.dll MiniDump (none known
    to the author in enterprise settings).
level: critical
