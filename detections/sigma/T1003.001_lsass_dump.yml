title: LSASS Process Access with Dump-Pattern GrantedAccess
id: 4b1e9f2a-8c3d-47b2-9e1a-purple-lab-T1003001-b
status: stable
description: |
  Companion rule. Detects ProcessAccess events targeting lsass.exe with the
  access masks commonly used to dump credentials (0x1010, 0x1410, 0x1438,
  0x1FFFFF). These masks include PROCESS_VM_READ which is required to read
  LSASS memory for a MiniDump.
author: cyberknight91
date: 2026/04/20
references:
  - https://attack.mitre.org/techniques/T1003/001/
  - https://www.elastic.co/security-labs/detecting-lsass-access
tags:
  - attack.credential_access
  - attack.t1003.001
logsource:
  category: process_access
  product: windows
detection:
  selection_target:
    TargetImage|endswith: '\lsass.exe'
  selection_mask:
    GrantedAccess:
      - '0x1010'
      - '0x1038'
      - '0x1410'
      - '0x1438'
      - '0x1FFFFF'
  filter_system_sources:
    SourceImage|endswith:
      - '\MsMpEng.exe'        # Windows Defender
      - '\MsSense.exe'        # Microsoft Defender for Endpoint
      - '\SenseIR.exe'
      - '\CSFalconService.exe' # CrowdStrike
      - '\csagent.exe'
      - '\SophosSystemProtectionService.exe'
      - '\wazuh-agent.exe'
  condition: all of selection_* and not filter_system_sources
fields:
  - SourceImage
  - SourceProcessGUID
  - TargetImage
  - GrantedAccess
  - CallTrace
falsepositives:
  - EDR / AV products that legitimately read LSASS — maintain the source
    filter list above; add your EDR executable if it is not already there.
  - Some vulnerability scanners (Tenable, Qualys) read process memory for
    inspection.
level: high
