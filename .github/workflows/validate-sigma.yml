name: Validate Sigma rules

on:
  push:
    branches: [main]
    paths:
      - 'detections/sigma/**.yml'
      - '.github/workflows/validate-sigma.yml'
  pull_request:
    paths:
      - 'detections/sigma/**.yml'

jobs:
  sigma-check:
    name: sigma-cli check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install sigma-cli
        run: |
          python -m pip install --upgrade pip
          pip install "sigma-cli>=1.0.0" "pysigma-backend-elasticsearch" "pysigma-backend-splunk"

      - name: Validate all Sigma rules
        run: sigma check detections/sigma/

      - name: Convert to Elastic (smoke test)
        run: sigma convert -t lucene detections/sigma/ > /tmp/elastic.rules || true

      - name: Convert to Splunk (smoke test)
        run: sigma convert -t splunk detections/sigma/ > /tmp/splunk.rules || true

      - name: Summary
        run: |
          echo "### Sigma validation passed" >> $GITHUB_STEP_SUMMARY
          echo "Rules checked: $(find detections/sigma -name '*.yml' | wc -l)" >> $GITHUB_STEP_SUMMARY
